  llm_rpc:
    build: ./llm_rpc_server
    command: python3 rpc_server.py
    container_name: llm_rpc
    environment:
      - CHROMA=chromadb
      - OLLAMA_HOST=ollama
      - MODEL=deepseek-r1
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - ollama
