# local LLMs
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - /usr/share/ollama/.ollama:/root/.ollama
    networks:
      - internal
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  deepseek:
    build: ./deepseek-service
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 82
    container_name: deepseek
    environment:
      - CHROMA=chromadb
      - OLLAMA_HOST=ollama
      - MODEL=deepseek-r1
    ports:
      - "8002:82"
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - ollama
# Vector storage and analytics
  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - internal
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ${PWD}/config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - zipkin
    networks:
      - internal
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ${PWD}/config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - internal
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana:/var/lib/grafana
    networks:
      - internal
    depends_on:
      - prometheus
    restart: unless-stopped
  chromadb:
    image: chromadb/chroma:1.0.16.dev5
    container_name: chromadb
    environment:
      - IS_PERSISTENT=TRUE   
      - CHROMA_OPEN_TELEMETRY__ENDPOINT=http://otel-collector:4317/
      - CHROMA_OPEN_TELEMETRY__SERVICE_NAME=chromadb
    ports:
      - "8070:8070"
    volumes:
      - chroma:/data
      - ./config/chroma.yaml:/config.yaml
    depends_on:
      - otel-collector
      - zipkin
      - prometheus
      - rabbitmq
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  grafana: 
  rabbitmq:
  chroma: